name: Refresh release catalogue
on:
  push:
    paths:
      - 'update.py'
      - '.github/workflows/**'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: refresh-release-catalogue
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 update.py
      - name: Publish changed catalogue
        run: |
          git add -- source.json history.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh official release versions'
            git push
          fi
